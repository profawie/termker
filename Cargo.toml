[package]
name = "rterminalfy"
version = "0.1.0"
edition = "2024"
description = "Klien SSH desktop untuk individu, ditulis sepenuhnya dalam Rust"
repository = "https://github.com/profawie/rterminalfy"
rust-version = "1.92"

[dependencies]
directories = "6.0"
eframe = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }

[profile.release]
lto = "thin"
strip = true
