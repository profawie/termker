[package]
name = "rterminalfy"
version = "0.1.0"
edition = "2024"
description = "Desktop SSH client for individuals, written entirely in Rust"
license = "MIT OR Apache-2.0"
repository = "https://github.com/profawie/rterminalfy"
rust-version = "1.92"

[dependencies]
alacritty_terminal = "0.26"
directories = "6.0"
eframe = "0.37"
keyring = "4.2"
rand = { version = "0.10", features = ["thread_rng"] }
rfd = "0.18"
russh = { version = "0.65", default-features = false, features = ["ring", "rsa", "flate2"] }
russh-sftp = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "macros", "time", "io-util", "fs"] }
uuid = { version = "1", features = ["v4", "serde"] }

# Release builds favour a small program. Measured on the Windows build
# (x86_64-pc-windows-gnu): 23.5 MB with thin LTO, 17.3 MB with fat LTO and
# one codegen unit, 13.2 MB when also optimizing for size. Network and disk
# speed limit an SSH client long before code speed does. Panics still
# unwind, so a failing background task does not take the whole app down.
[profile.release]
lto = "fat"
codegen-units = 1
opt-level = "s"
strip = true
