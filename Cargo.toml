[package]
name = "rterminalfy"
version = "0.1.0"
edition = "2024"
description = "Desktop SSH client for individuals, written entirely in Rust"
license = "MIT OR Apache-2.0"
repository = "https://github.com/profawie/rterminalfy"
rust-version = "1.92"

[dependencies]
alacritty_terminal = "0.26"
directories = "6.0"
eframe = "0.37"
keyring = "4.2"
rand = { version = "0.10", features = ["thread_rng"] }
rfd = "0.18"
russh = { version = "0.65", default-features = false, features = ["ring", "rsa", "flate2"] }
russh-sftp = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "macros", "time", "io-util", "fs"] }
uuid = { version = "1", features = ["v4", "serde"] }

# Security keys over USB. On Windows, direct USB access to a security key
# needs administrator rights, so Windows' own WebAuthn API is used there.
[target.'cfg(not(windows))'.dependencies]
ctap-hid-fido2 = "3.6"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Networking_WindowsWebServices", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
lto = "thin"
strip = true
