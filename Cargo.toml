[workspace]
members = ["crates/*"]
# Plain `cargo build`, `cargo test` and `cargo clippy` cover every crate.
default-members = [".", "crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/profawie/rterminalfy"
rust-version = "1.92"

# Every third-party library, in one place. The About screen lists exactly
# these (see build.rs and src/libs.rs).
[workspace.dependencies]
alacritty_terminal = "0.26"
directories = "6.0"
eframe = "0.37"
keyring = "4.2"
rand = { version = "0.10", features = ["thread_rng"] }
rfd = "0.18"
russh = { version = "0.65", default-features = false, features = ["ring", "rsa", "flate2"] }
russh-sftp = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "macros", "time", "io-util", "fs"] }
uuid = { version = "1", features = ["v4", "serde"] }

# The app's own crates.
rterminalfy-core = { path = "crates/core" }
rterminalfy-ssh = { path = "crates/ssh" }
rterminalfy-terminal = { path = "crates/terminal" }

[package]
name = "rterminalfy"
description = "Desktop SSH client for individuals, written entirely in Rust"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
alacritty_terminal.workspace = true
eframe.workspace = true
rfd.workspace = true
rterminalfy-core.workspace = true
rterminalfy-ssh.workspace = true
rterminalfy-terminal.workspace = true
tokio.workspace = true
uuid.workspace = true

# Release builds favour a small program. Measured on the Windows build
# (x86_64-pc-windows-gnu): 23.5 MB with thin LTO, 17.3 MB with fat LTO and
# one codegen unit, 13.2 MB when also optimizing for size. Network and disk
# speed limit an SSH client long before code speed does. Panics still
# unwind, so a failing background task does not take the whole app down.
[profile.release]
lto = "fat"
codegen-units = 1
opt-level = "s"
strip = true
